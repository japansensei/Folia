name: Patch and Build

on:
  workflow_dispatch: {}
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git User
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      # 1) применяем патчи
      - name: Apply patches
        run: ./gradlew :applyAllPatches --stacktrace

      # 2) собираем всё, не угадывая имя конкретной задачи артефакта
      - name: Build all
        run: ./gradlew build --stacktrace

      # 3) смотрим, куда всё вывалилось
      - name: List candidate jars
        run: |
          echo "Root build/libs:"
          ls -lah build/libs || true
          echo "All build/libs:"
          find . -type d -name libs -path "*/build/libs" -print -exec ls -lah {} \; || true

      # 4) загружаем все подходящие jar'ы
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folia-1.21.8
          path: |
            **/build/libs/*paperclip*.jar
            **/build/libs/*bundler*.jar
            **/build/libs/*reobf*.jar
            **/build/libs/*.jar
          if-no-files-found: warn
