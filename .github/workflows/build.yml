name: Patch and Build

on:
  workflow_dispatch: {}
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git User
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      # 1) применяем патчи (важно вызывать applyAllPatches)
      - name: Apply patches
        run: ./gradlew :applyAllPatches --stacktrace

      # 2) собираем jar (выбери один блок: bundler ИЛИ paperclip)
      - name: Build server jar (bundler)
        run: ./gradlew :createReobfBundlerJar --stacktrace

      # - name: Build server jar (paperclip)
      #   run: ./gradlew :createReobfPaperclipJar --stacktrace

      # 3) посмотрим, куда Gradle положил файлы
      - name: List outputs
        run: |
          echo "root build/libs:"
          ls -lah build/libs || true
          echo "server subproject build/libs:"
          ls -lah **/build/libs || true

      # 4) прикрепляем артефакты (подхватим и root, и сабпроекты)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folia-1.21.8
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
